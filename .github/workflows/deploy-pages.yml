name: Deploy to GitHub Pages

on:
  push:
    tags: [v*]

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The tag normally points at a commit that already passed ci.yml on main, so
  # this job keeps only what a deploy gate needs: the tagged commit is on main,
  # and the built artifact boots. The boot check runs the one smoke spec under
  # the same Xvfb + software Vulkan stack as ci.yml; without that stack,
  # Chromium is launched with playwright.config's Linux GPU flags against a
  # runner that cannot honour them (this hung the v0.1.9 deploy).
  boot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        # compare main...<sha> reports "identical" when the tag is main's tip and
        # "behind" when main has moved on. Anything else (ahead / diverged) means
        # the tag was cut from a commit that never passed ci.yml.
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) echo "Tagged commit is on main ($status)." ;;
            *) echo "::error::Tagged commit is not on main (compare status: $status) and never passed ci.yml."; exit 1 ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # ensure correct base for GitHub project pages URL
        run: npm run build -- --base /vibe-aquarium-sim/

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install software Vulkan and virtual display
        # The smoke spec renders real frames, so it needs the same software GPU
        # stack and Xvfb display that ci.yml uses (see playwright.config.ts).
        run: sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth

      - name: Boot check
        # The single smoke spec: the room boots, the fish load, feeding and the
        # viewpoint/clock controls respond, and the page logs no errors.
        run: xvfb-run --auto-servernum npx playwright test tests/e2e/smoke.spec.ts --headed

  build:
    needs: boot-check
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # ensure correct base for GitHub project pages URL
        run: npm run build -- --base /vibe-aquarium-sim/

      - name: Drop build metadata
        # dist/.vite holds the chunk manifest for check:bundle; it is not part of the site.
        run: rm -rf dist/.vite

      - name: Upload build artifact for Pages
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
