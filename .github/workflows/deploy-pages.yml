name: Deploy to GitHub Pages

on:
  push:
    tags: [v*]

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The tag normally points at a commit that already passed the full suite in
  # ci.yml on main - including the renderer-heavy visual-quality and mobile-ux
  # specs, which run there under Xvfb with the software Vulkan stack. Repeating
  # that suite here cost ~6-9 minutes of software rasterization per release and
  # flaked: this workflow never installed libvulkan1/mesa-vulkan-drivers/xvfb,
  # so Chromium was launched with playwright.config's linux GPU flags against a
  # runner stripped of the GPU stack, and an input event in mobile-ux.spec.ts
  # hung until its 60s timeout while build/deploy were skipped.
  # This job therefore keeps only what a deploy gate needs: the tagged commit is
  # on main, and the built artifact boots.
  boot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        # compare main...<sha> reports "identical" when the tag is main's tip and
        # "behind" when main has moved on. Anything else (ahead / diverged) means
        # the tag was cut from a commit that never passed ci.yml.
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) echo "Tagged commit is on main ($status)." ;;
            *) echo "::error::Tagged commit is not on main (compare status: $status) and never passed ci.yml."; exit 1 ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # ensure correct base for GitHub project pages URL
        run: npm run build -- --base /vibe-aquarium-sim/

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Boot check
        # One existing spec: the shell renders, the canvas mounts, the renderer
        # reports a backend, there are no page errors and no 404s, and the fish
        # model is served with the expected content type. Seconds, not minutes.
        run: npx playwright test tests/e2e/smoke.spec.ts --grep "boots the aquarium shell"

  build:
    needs: boot-check
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # ensure correct base for GitHub project pages URL
        run: npm run build -- --base /vibe-aquarium-sim/

      - name: Upload build artifact for Pages
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
