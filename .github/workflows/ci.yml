name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Issue 141 evidence
        run: npm run typecheck:issue141

      - name: Unit and integration tests
        run: npm run test -- --run

      - name: Coverage report
        run: npm run test:coverage -- --run

      - name: Build production bundle
        run: npm run build

      - name: Check bundle and model budgets
        run: npm run check:bundle

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install software Vulkan and virtual display
        run: sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth

      - name: Browser smoke test
        # Linux WebGPU screenshots need the presenting compositor, not the
        # headless capture path. Xvfb provides a display without a physical GPU.
        run: xvfb-run --auto-servernum npm run test:smoke -- --headed

      - name: Upload browser evidence
        if: always()
        # Evidence only — a flaky upload must not red the build.
        # Upstream flake: https://github.com/actions/upload-artifact/issues/560 (403 on FinalizeArtifact)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
